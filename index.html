<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ราชประชาเกมส์</title>
<meta name="theme-color" content="#065F46">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link href="https://fonts.googleapis.com/css2?family=Pridi:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --g950:#052E16;--g900:#064E3B;--g800:#065F46;--g700:#047857;--g600:#059669;--g500:#10B981;--g300:#6EE7B7;--g200:#A7F3D0;--g100:#D1FAE5;--g50:#ECFDF5;
  --y600:#D97706;--y500:#F59E0B;--y400:#FBBF24;--y200:#FDE68A;--y100:#FEF3C7;--y50:#FFFBEB;
  --ink:#1E293B;--mut:#64748B;--line:#E2E8F0;--bg:#F4FBF7;--red:#E11D48;--redbg:#FFF1F2;
  --r:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Sarabun','TH Sarabun New',sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(at 0% 0%,rgba(167,243,208,.35) 0,transparent 50%),radial-gradient(at 100% 0%,rgba(254,240,138,.4) 0,transparent 50%);
  background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit}
h1,h2,h3,h4{margin:0;line-height:1.3}
a{color:var(--g700)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--g300);border-radius:9px}
.hide{display:none!important}
.mut{color:var(--mut)}.sm{font-size:.85rem}.xs{font-size:.78rem}.b{font-weight:700}.c{text-align:center}.r{text-align:right}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}.grow{flex:1 1 auto}
.mt1{margin-top:.5rem}.mt2{margin-top:1rem}.mt3{margin-top:1.5rem}.mb1{margin-bottom:.5rem}.mb2{margin-bottom:1rem}
.grid{display:grid;gap:1rem}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}

/* topbar */
#topbar{position:fixed;left:0;right:0;top:0;height:3px;z-index:10000;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .25s}
#topbar.on{opacity:1}
#topbar b{position:absolute;inset:0;background:linear-gradient(90deg,#6EE7B7,#10B981,#FBBF24);animation:tb 1.2s ease-in-out infinite}
@keyframes tb{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* controls */
.inp{width:100%;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:.55rem .8rem;line-height:1.3;transition:.15s}
.inp:hover{border-color:var(--g300)}.inp:focus{outline:none;border-color:var(--g500);box-shadow:0 0 0 3px rgba(16,185,129,.16)}
textarea.inp{min-height:90px;resize:vertical}
.lbl{display:block;font-size:.82rem;font-weight:700;color:#334155;margin-bottom:.25rem}
.hint{font-size:.76rem;color:var(--mut);margin-top:.2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.55rem 1.05rem;border-radius:12px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:.15s;user-select:none;white-space:nowrap;background:#fff;color:#334155;border-color:var(--line)}
.btn:hover:not(:disabled){background:var(--g50);border-color:var(--g200);color:var(--g700)}
.btn:active:not(:disabled){transform:scale(.97)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,#10B981,#059669);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(16,185,129,.28)}
.btn-primary:hover:not(:disabled){background:linear-gradient(135deg,#059669,#047857);color:#fff;border-color:transparent}
.btn-sun{background:linear-gradient(135deg,#FDE047,#FBBF24);color:#78350F;border-color:#FCD34D}
.btn-sun:hover:not(:disabled){background:linear-gradient(135deg,#FDE047,#F59E0B);color:#78350F;border-color:#FCD34D}
.btn-danger{background:linear-gradient(135deg,#FB7185,#E11D48);color:#fff;border-color:transparent}
.btn-danger:hover:not(:disabled){background:#BE123C;color:#fff;border-color:transparent}
.btn-sm{padding:.3rem .65rem;font-size:.82rem;border-radius:10px}
.btn-icon{padding:.3rem .55rem}
.card{background:rgba(255,255,255,.96);border:1px solid #E2F2EA;border-radius:18px;box-shadow:0 8px 24px -8px rgba(5,150,105,.08);padding:1.1rem 1.25rem}
.card h3{font-size:1.05rem;color:var(--g900)}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.12rem .6rem;border-radius:999px;font-size:.76rem;font-weight:700;background:#F1F5F9;color:#475569;white-space:nowrap}
.chip.ok{background:var(--g100);color:var(--g800)}.chip.warn{background:var(--y100);color:#92400E}.chip.bad{background:var(--redbg);color:#BE123C}.chip.info{background:#E0F2FE;color:#075985}
.dot{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12)}
.cchip{display:inline-flex;align-items:center;gap:.4rem;padding:.12rem .65rem .12rem .45rem;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:.84rem;white-space:nowrap}

/* tables */
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
.t th{background:var(--g50);color:var(--g800);font-weight:700;text-align:left;padding:.6rem .75rem;font-size:.8rem;white-space:nowrap;position:sticky;top:0}
.t td{padding:.55rem .75rem;border-top:1px solid #EEF2F6;vertical-align:middle}
.t tr:hover td{background:#FAFFFC}
.t .num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:2rem 1rem;text-align:center;color:var(--mut)}

/* layout */
.shell{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 236px;background:linear-gradient(180deg,var(--g900),var(--g950));color:#D1FAE5;padding:1rem .7rem;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{display:flex;gap:.6rem;align-items:center;padding:.3rem .5rem 1rem;color:#fff}
.side .brand img,.brand-ico{width:42px;height:42px;border-radius:12px;background:var(--y400);display:grid;place-items:center;color:var(--g900);flex:0 0 auto;object-fit:contain}
.side .brand img{width:56px;height:56px;background:#fff;padding:10px;border-radius:50%;object-fit:contain;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.side .brand .brand-ico{border-radius:50%;width:56px;height:56px}
.side .brand b{display:block;font-size:.95rem;line-height:1.2}.side .brand span{font-size:.72rem;color:var(--g200)}
.nav a{display:flex;gap:.6rem;align-items:center;padding:.55rem .75rem;border-radius:12px;color:#D1FAE5;text-decoration:none;font-weight:600;font-size:.92rem;cursor:pointer;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:var(--y400);color:#78350F}
.nav svg{width:18px;height:18px;flex:0 0 auto}
.main{flex:1;min-width:0;padding:1.2rem 1.4rem 3rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.1rem;flex-wrap:wrap}
.top h2{font-size:1.45rem;color:var(--g900)}
.menu-btn{display:none}
@media(max-width:900px){
  .shell{display:block}.side{position:fixed;left:-260px;top:0;z-index:900;transition:left .2s;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .side.open{left:0}.menu-btn{display:inline-flex}.main{padding:1rem .8rem 3rem}
  .scrim{position:fixed;inset:0;background:rgba(15,40,30,.4);z-index:850}
}

/* public hero */
.hero{background:linear-gradient(135deg,var(--g900) 0%,var(--g700) 55%,#0F766E 100%);color:#fff;padding:1.4rem 1.2rem 4.2rem;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-80px;top:-80px;width:300px;height:300px;border-radius:50%;background:rgba(251,191,36,.22)}
.hero:after{content:"";position:absolute;left:-60px;bottom:-110px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07)}
.wrap{max-width:1040px;margin:0 auto;position:relative;z-index:1}
.hero h1{font-size:clamp(1.5rem,4.5vw,2.4rem);font-weight:800;letter-spacing:.01em}
.hero .hero-t{font-size:clamp(.95rem,2.4vw,1.3rem);line-height:1.25;margin:0}.hero .hero-s{font-size:clamp(.78rem,1.8vw,.92rem);opacity:.92;margin-top:.3rem;font-weight:600}
.hero .hl{display:block;white-space:nowrap}.hero .hp{font-size:.8em;font-weight:600;opacity:.9;margin-top:.1rem}.hero .hero-o{margin-top:.1rem;opacity:.8;font-weight:500}
.hero .sub{opacity:.92;margin-top:.25rem}
.hero .meta{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem}
.hero .meta span{background:rgba(255,255,255,.14);padding:.2rem .75rem;border-radius:999px;font-size:.85rem;font-weight:600}
.pub-body{max-width:1040px;margin:-3rem auto 0;padding:0 1rem 3rem;position:relative;z-index:2}
.tick{display:flex;align-items:center;overflow:hidden;white-space:nowrap;color:#fff;font-weight:600;font-size:1rem;letter-spacing:.01em;--ta:#047857;--tb:#0D9488;background:linear-gradient(100deg,var(--ta),var(--tb))}
.tick.gold{--ta:#B45309;--tb:#F59E0B}.tick.blue{--ta:#1D4ED8;--tb:#6366F1}.tick.red{--ta:#BE123C;--tb:#F43F5E}
.tick .tk-i{flex:0 0 auto;display:grid;place-items:center;padding:0 .3rem 0 1.1rem}
.tick .tk-i i{display:block;width:.55rem;height:.55rem;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:tkpulse 1.8s ease-out infinite}
.tick .tk-w{flex:1;overflow:hidden;position:relative;padding:.75rem 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 94%,transparent)}
.tick .tk-m{display:inline-block;padding-left:100%;animation:tkmove var(--d,30s) linear infinite;will-change:transform}
.tick:hover .tk-m{animation-play-state:paused}
.tick .tk-m span{display:inline-block}
.tick .tk-m span::after{content:"";display:inline-block;width:.42rem;height:.42rem;background:rgba(255,255,255,.75);transform:rotate(45deg);margin:0 1.7rem .12rem 1.7rem}
@keyframes tkpulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.65)}70%{box-shadow:0 0 0 .55rem rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@keyframes tkmove{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.tick .tk-m{animation:none;padding-left:.8rem;white-space:normal}.tick .tk-i i{animation:none}}
.notice{background:var(--y100);border:1px solid var(--y200);color:#78350F;border-radius:14px;padding:.7rem 1rem;font-weight:600;margin-bottom:1rem}
.tabs{display:flex;gap:.3rem;background:#fff;border:1px solid var(--line);padding:.3rem;border-radius:14px;margin-bottom:1rem;overflow-x:auto}
.tabs a{flex:1 1 auto;text-align:center;padding:.55rem 1rem;border-radius:11px;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap}
.tabs a.on{background:var(--g600);color:#fff}

/* scoreboard */
.sb-row{display:grid;grid-template-columns:46px 1fr auto;gap:.8rem;align-items:center;padding:.8rem 0;border-top:1px solid #EEF2F6}
.sb-row:first-child{border-top:0}
.rk{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.15rem;background:#F1F5F9;color:#475569}
.rk.r1{background:linear-gradient(135deg,#FDE047,#F59E0B);color:#78350F}.rk.r2{background:linear-gradient(135deg,#E5E7EB,#9CA3AF);color:#1F2937}.rk.r3{background:linear-gradient(135deg,#FDBA74,#C2410C);color:#fff}
.bar{height:16px;border-radius:99px;background:#EEF2F6;overflow:hidden;margin:.3rem 0}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pts{font-size:1.9rem;font-weight:800;line-height:1;color:var(--g900);font-variant-numeric:tabular-nums;text-align:right}
.pts small{display:block;font-size:.72rem;font-weight:600;color:var(--mut)}
.medals{display:flex;gap:.5rem;font-size:.82rem;font-weight:700}
.medals span{display:inline-flex;align-items:center;gap:.25rem}
.md{width:.85rem;height:.85rem;border-radius:50%;display:inline-block}
.md.g{background:#F59E0B}.md.s{background:#9CA3AF}.md.b{background:#C2410C}
.prog{height:10px;border-radius:99px;background:#E5E7EB;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g500),var(--y400));border-radius:99px}
.stat{padding:1rem 1.1rem;border-radius:16px;background:#fff;border:1px solid #E2F2EA}
.stat b{display:block;font-size:1.8rem;color:var(--g900);line-height:1.1}.stat span{color:var(--mut);font-size:.84rem;font-weight:600}

/* result list */
.evres{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;margin-bottom:.7rem}
.evres header{background:var(--g50);padding:.55rem .9rem;font-weight:700;color:var(--g900);display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.evres .it{display:flex;gap:.6rem;align-items:center;padding:.45rem .9rem;border-top:1px solid #EEF2F6;flex-wrap:wrap}
.evres .it .n{width:1.7rem;font-weight:800;text-align:center}

/* register */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.45rem}
.pick label{display:flex;gap:.55rem;align-items:flex-start;padding:.5rem .65rem;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-size:.9rem}
.pick label.sel{border-color:var(--g500);background:var(--g50)}
.pick label.dis{opacity:.5;cursor:not-allowed;background:#F8FAFC}
.pick input{margin-top:.25rem;accent-color:var(--g600);width:1.05rem;height:1.05rem}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.cell0{background:var(--redbg);color:#BE123C;font-weight:700}.cellok{background:var(--g50);color:var(--g800);font-weight:700}

/* modal / toast */
.overlay{position:fixed;inset:0;background:rgba(15,40,30,.5);backdrop-filter:blur(3px);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto;animation:fi .15s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.mcard{background:#fff;border-radius:20px;width:100%;max-width:520px;box-shadow:0 24px 60px -12px rgba(5,60,40,.5);overflow:hidden;animation:up .2s ease}
.mcard.wide{max-width:820px}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.mhead{background:linear-gradient(135deg,var(--g700),var(--g600));color:#fff;padding:.9rem 1.2rem;font-weight:800;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.mhead.danger{background:linear-gradient(135deg,#FB7185,#E11D48)}.mhead.sun{background:linear-gradient(135deg,#FDE047,#F59E0B);color:#78350F}
.mbody{padding:1.1rem 1.2rem;max-height:68vh;overflow-y:auto}
.mfoot{padding:.8rem 1.2rem 1.1rem;display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.xbtn{background:rgba(255,255,255,.2);border:0;color:inherit;width:2rem;height:2rem;border-radius:50%;cursor:pointer;font-size:1.1rem}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}.fgrid .full{grid-column:1/-1}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.err{background:var(--redbg);color:#BE123C;border-radius:10px;padding:.5rem .8rem;font-weight:600;font-size:.88rem;margin-top:.7rem}
#toasts{position:fixed;right:14px;bottom:14px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 28px)}
.toast{background:var(--g900);color:#fff;padding:.7rem 1rem;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .2s}
.toast.err{background:#BE123C}
.loginbox{max-width:400px;margin:0 auto}
.spin{display:inline-block;width:1rem;height:1rem;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:80vh;color:var(--g700);font-weight:700}
.splash .sp-logo{width:132px;height:132px;border-radius:50%;background:#fff;padding:7px;object-fit:contain;box-shadow:0 4px 18px rgba(0,0,0,.15);animation:spPulse 1.6s ease-in-out infinite}
.splash .sp-ring{position:relative;width:152px;height:152px;display:grid;place-items:center}
.splash .sp-ring:before{content:"";position:absolute;inset:0;border-radius:50%;border:4px solid rgba(0,0,0,.08);border-top-color:var(--g700,#15803d);animation:spSpin 1s linear infinite}
.splash .sp-txt{font-size:15px;letter-spacing:.3px}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spPulse{50%{transform:scale(.95)}}

/* ===================== ธีมกีฬา (Sport theme) ===================== */
:root{--disp:'Kanit','Sarabun','TH Sarabun New',sans-serif;--track:#C2410C;--gold:linear-gradient(135deg,#FDE047,#F59E0B)}
.hero h1,.hero .hero-t,.top h2,.card h3,.pts,.rk,.stat b,.mhead,.tabs a,.side .brand b,.sb-row b,.evres header{font-family:var(--disp)}
body{background-image:radial-gradient(at 0% 0%,rgba(167,243,208,.45) 0,transparent 45%),radial-gradient(at 100% 0%,rgba(253,224,71,.35) 0,transparent 45%),radial-gradient(at 50% 100%,rgba(186,230,253,.25) 0,transparent 50%)}

/* hero: สนามกีฬา — ลู่วิ่งโค้ง แถบความเร็ว ขอบเฉียง */
.hero{background:linear-gradient(125deg,#032B1E 0%,#065F46 48%,#0F766E 100%);padding:.6rem 1.2rem 3.3rem;clip-path:polygon(0 0,100% 0,100% calc(100% - 20px),0 100%);isolation:isolate}
.hero:before{content:"";position:absolute;right:-140px;top:auto;bottom:-260px;width:620px;height:620px;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,.13) 0 2px,transparent 2px 22px);z-index:-1;opacity:.9}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;top:0;border-radius:0;width:auto;height:auto;background:
  linear-gradient(112deg,transparent 0 62%,rgba(251,191,36,.95) 62% 63.2%,transparent 63.2% 64.4%,rgba(255,255,255,.55) 64.4% 65%,transparent 65% 66.4%,rgba(255,255,255,.07) 66.4% 74%,transparent 74%);z-index:-1;pointer-events:none}
.hero .hero-t{font-weight:700;letter-spacing:.005em;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.hero .hl:first-child{font-size:1.18em;font-weight:800;font-style:italic;background:linear-gradient(180deg,#fff 30%,#FDE68A);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.hero .meta span{background:rgba(255,255,255,.12);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.22)}
.hero .btn-sun{box-shadow:0 8px 20px -6px rgba(251,191,36,.7);font-weight:800;font-family:var(--disp)}
.brand-wrap img,.hero .brand-ico{box-shadow:0 0 0 4px rgba(255,255,255,.22),0 10px 24px rgba(0,0,0,.28)!important}

.pub-body .tick{border-radius:999px;margin:.8rem 0 1rem;box-shadow:0 10px 22px -10px rgba(15,23,42,.45)}

/* การ์ดและแท็บ */
.card{border-radius:20px;border:1px solid #DCEFE4;box-shadow:0 14px 34px -14px rgba(5,95,70,.22);background-color:rgba(255,255,255,.97);background-image:linear-gradient(90deg,#10B981,#FBBF24 55%,#F97316);background-size:100% 4px;background-repeat:no-repeat}
.card h3{font-weight:700;letter-spacing:.005em}
.tabs{border-radius:999px;padding:.35rem;background:rgba(255,255,255,.92);box-shadow:0 10px 26px -12px rgba(5,95,70,.35);border:1px solid #DCEFE4}
.tabs a{border-radius:999px;transition:.18s;font-weight:600}
.tabs a:hover:not(.on){background:var(--g50);color:var(--g700)}
.tabs a.on{background:linear-gradient(135deg,#10B981,#047857);box-shadow:0 6px 16px -4px rgba(4,120,87,.55)}
.notice{border-radius:16px;border:0;background:linear-gradient(100deg,#FEF3C7,#FDE68A);box-shadow:0 6px 16px -8px rgba(217,119,6,.5)}

/* กระดานคะแนน */

.cert .evn{font-family:'Sarabun',sans-serif;font-size:18pt;font-weight:700;color:#0B5D3B;margin-top:.8mm}
.cert .evs{font-family:'Sarabun',sans-serif;font-size:14pt;color:#374151;margin-top:.4mm}
.cert .dt{font-family:'Sarabun',sans-serif;font-size:12.5pt;color:#4B5563;margin-top:2.2mm}
.cert .cmd{position:absolute;left:50%;bottom:16.5mm;width:15mm;height:auto;border-radius:0;background:none;box-shadow:none;transform:translateX(-50%)}.cert .cmd .medal{width:100%;display:block}
.cert .sg{position:absolute;bottom:22mm;width:70mm;font-family:'Sarabun',sans-serif}.cert .sl{left:34mm}.cert .sr{right:34mm}
.cert .sg .ln{border-bottom:.3mm dotted #4B5563;height:9mm;margin-bottom:1.2mm}
.cert .sg .sn{font-size:12.5pt;font-weight:700;color:#111827}.cert .sg .st{font-size:11pt;color:#4B5563;line-height:1.2}
#print-area .certs{margin:0;padding:0}
@media print{body.printing #print-area .certs .cert{margin:0;box-shadow:none}}
/* fixtures */
.mc{border:1.5px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;min-width:215px}
.mc.click{cursor:pointer}.mc.click:hover{border-color:#10B981;box-shadow:0 4px 14px -6px rgba(5,100,70,.4)}
.mc .mh{display:flex;justify-content:space-between;gap:.5rem;padding:.3rem .7rem;background:#F8FAFC;font-size:.74rem;color:var(--mut);font-weight:700}
.mc .tr{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.42rem .7rem;border-top:1px solid var(--line);font-weight:600}
.mc .tr.w{background:var(--g100);font-weight:800}.mc .tr.tbd{color:var(--mut);font-weight:500;font-style:italic}
.mc .tr .sc{min-width:1.6rem;text-align:right;font-variant-numeric:tabular-nums;font-size:1.1rem;font-weight:800}
.mc .mf{padding:.28rem .7rem;border-top:1px dashed var(--line);font-size:.74rem;color:var(--mut)}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.7rem}
.bracket{display:flex;gap:1.4rem;overflow-x:auto;padding-bottom:.6rem;align-items:stretch}
.bracket .col{display:flex;flex-direction:column;justify-content:space-around;gap:.8rem;min-width:225px;flex:1}
.bracket .col:last-child{justify-content:center}
.fxrow{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.2rem 0;border-bottom:1px solid var(--line)}.fxmv{display:flex;gap:.25rem}
.bracket .col h4{text-align:center;font-size:.85rem;color:var(--g800)}
</style>

  return (withDay ? 'วัน' + TH_D[d.getDay()] + 'ที่ ' : '') + (+m[3]) + ' ' + TH_M[+m[2] - 1] + ' ' + (+m[1] + 543);
}

}

var ROLE_LABEL = { admin: 'ผู้ดูแลระบบ', organizer: 'คณะกรรมการจัดการแข่งขัน', referee: 'กรรมการ/ผู้บันทึกผล', colorHead: 'ครูที่ปรึกษา/หัวหน้าสี', viewer: 'ผู้บริหาร/ผู้ชม' };

function statusChip(s) { var x = STATUS[s] || STATUS.planned; return '<span class="chip ' + x[1] + '">' + x[0] + '</span>'; }
function evLabel(e) { return e.name + (e.gender && e.gender !== 'ผสม' ? ' ' + e.gender : '') + (e.levelGroup && e.levelGroup !== 'ทุกระดับ' ? ' ' + e.levelGroup : ''); }
function isStaff() { return S.user && (S.user.role === 'admin' || S.user.role === 'organizer'); }

function levelOf(cl) {
  var t = String(cl || '').trim(), p = /^ป\.?\s*(\d+)/.exec(t);
  if (p) { var k = +p[1]; return k >= 1 && k <= 3 ? 'ป.ต้น' : (k >= 4 && k <= 6 ? 'ป.ปลาย' : ''); }
  var m = /ม\.?\s*(\d+)/.exec(t); if (!m) return '';
  var n = +m[1]; return n >= 1 && n <= 3 ? 'ม.ต้น' : (n >= 4 && n <= 6 ? 'ม.ปลาย' : '');
}
function levelOk(evLevel, cl) {
  if (!evLevel || evLevel === 'ทุกระดับ') return true;

  return evLevel === 'ประถม' ? (g === 'ป.ต้น' || g === 'ป.ปลาย') : g === evLevel;
}
function eligible(ev, st) {
  if (ev.gender === 'ชาย' && st.gender !== 'ชาย') return false;

  return levelOk(ev.levelGroup, st.classLevel);
}
function ptsOf(scheme, rank) {

}

      if (!url || /^\s*$/.test(url) || url.indexOf('PASTE_') > -1) return rej(new Error('ยังไม่ได้ตั้งค่า apiUrl ในไฟล์ config.js'));
      tbar(1);

        .catch(function (e) { tbar(-1); rej(new Error(navigator.onLine === false ? 'ไม่มีการเชื่อมต่ออินเทอร์เน็ต' : (/failed to fetch|networkerror|load failed/i.test(cleanMsg(e)) ? 'เชื่อมต่อ Apps Script ไม่ได้ — ตรวจว่า Deploy เป็น "ผู้มีสิทธิ์เข้าถึง: ทุกคน (Anyone)" และเป็นเวอร์ชันล่าสุด แล้วลองเปิด URL /exec ในหน้าต่างไม่ระบุตัวตน' : cleanMsg(e)))); });

function pairKeyC(a, b) { return a < b ? a + '|' + b : b + '|' + a; }

  (S.d.matches || []).forEach(function (m) { if (!m.srcA && !m.srcB && m.colorA && m.colorB) { var k = pairKeyC(m.colorA, m.colorB); pc[k] = (pc[k] || 0) + 1; } });
  return pc;
}
function pairMatrixHtml() {

  var cs = S.d.colors.filter(function (c) { return used[c.id]; }), vals = [];
  cs.forEach(function (a, i) { cs.forEach(function (b, j) { if (j > i) vals.push(pc[pairKeyC(a.id, b.id)] || 0); }); });
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  var cell = function (a, b) { return a.id === b.id ? '<td class="c mut">—</td>' : '<td class="c"><b>' + (pc[pairKeyC(a.id, b.id)] || 0) + '</b></td>'; };

    '<div class="tw"><table class="t"><thead><tr><th></th>' + cs.map(function (c) { return '<th class="c">' + colorChip(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    cs.map(function (a) { return '<tr><td>' + colorChip(a) + '</td>' + cs.map(function (b) { return cell(a, b); }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' +
    '<div class="xs mut mt1">นับเฉพาะคู่ที่รู้สีแน่นอนตอนจับคู่ (รอบรองชนะเลิศ) ส่วนคู่ชิงอันดับ ๓ และชิงชนะเลิศขึ้นกับผลการแข่งขันจึงยังไม่นับ</div></div>';
}

function studentRank(s) {
  var m = /^(ป|ม)\.(\d+)/.exec(s.classLevel || '') || [], lv = m[1] === 'ม' ? 0 : 1, n = +m[2] || 0;
  return [lv, -n, +s.room || 0];
}
function studentsFiltered() {
  var v = vs('students'), q = (v.q || '').trim().toLowerCase();
  return S.d.students.filter(function (s) {
    return (!q || (s.fullname + ' ' + s.studentNo).toLowerCase().indexOf(q) > -1) && (!v.lv || s.classLevel === v.lv) && (!v.c || (v.c === 'none' ? !s.colorId : s.colorId === v.c));
  }).sort(function (a, b) {
    var x = studentRank(a), y = studentRank(b);
    return (x[0] - y[0]) || (x[1] - y[1]) || (x[2] - y[2]) || String(a.studentNo).localeCompare(String(b.studentNo), 'th', { numeric: true }) || a.fullname.localeCompare(b.fullname, 'th');
  });
}

function splitLine(l, d) {
  var out = [], cur = '', q = false;
  for (var i = 0; i < l.length; i++) {
    var ch = l.charAt(i);
    if (q) { if (ch === '"') { if (l.charAt(i + 1) === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === d) { out.push(cur); cur = ''; } else cur += ch;
  }

}
var COLS = { studentNo: ['เลขประจำตัว', 'รหัส', 'เลขประจำตัวนักเรียน', 'รหัสนักเรียน', 'studentno', 'id'], fullname: ['ชื่อ-สกุล', 'ชื่อสกุล', 'ชื่อ-นามสกุล', 'ชื่อนามสกุล', 'ชื่อ', 'fullname', 'name'], gender: ['เพศ', 'gender'], classLevel: ['ชั้น', 'ระดับชั้น', 'class', 'level'], room: ['ห้อง', 'room'], colorName: ['สี', 'color'] };
function parseStudents(text) {
  var lines = String(text || '').replace(/^﻿/, '').split(/\r?\n/).filter(function (l) { return l.trim() !== ''; });
  if (!lines.length) return [];
  var delim = lines[0].indexOf('\t') > -1 ? '\t' : ',', rows = lines.map(function (l) { return splitLine(l, delim); });
  var norm = function (s) { return String(s).replace(/\s+/g, '').toLowerCase(); };
  var map = {}, head = rows[0].map(norm), hit = 0;
  Object.keys(COLS).forEach(function (k) { var i = head.findIndex(function (h) { return COLS[k].map(norm).indexOf(h) > -1; }); if (i > -1) { map[k] = i; hit++; } });
  var start = 0;
  if (hit >= 2) start = 1; else map = { studentNo: 0, fullname: 1, gender: 2, classLevel: 3, room: 4, colorName: 5 };
  return rows.slice(start).map(function (r) { var o = {}; Object.keys(map).forEach(function (k) { o[k] = r[map[k]] || ''; }); return o; });
}

  var cs = S.d.events.filter(function (e) { return e.category === 'ประกวด' || e.mode === 'color'; }), shown = {};
  String(S.d.settings.contestShown || '').split(',').forEach(function (x) { if (x) shown[x] = 1; });
  if (cs.length) h += '<div class="card mt2"><h3 class="mb1">ประกาศผลรายการประกวดบนหน้าสาธารณะ</h3><div class="hint mb1">ประกาศแยกทีละรายการ ไม่เกี่ยวกับคะแนนรวมกีฬา ติ๊กรายการที่พร้อมประกาศ (ต้องบันทึกผลแล้ว) เจ้าหน้าที่เห็นผลทุกรายการตามปกติ</div>' +
    cs.map(function (e) { return '<label class="row" style="font-weight:600;cursor:pointer;margin:.3rem 0"><input type="checkbox" style="width:1.15rem;height:1.15rem" ' + (shown[e.id] ? 'checked' : '') + ' onchange="contestToggle(\'' + e.id + '\',this.checked)"> ' + esc(evLabel(e)) + ' ' + statusChip(e.status) + '</label>'; }).join('') + '</div>';
  var st = S.d.settings;
  h += '<div class="card mt2"><h3 class="mb1">ข้อความเลื่อน (แสดงใต้หัวเว็บหน้าสาธารณะ)</h3>' +
    '<label class="row" style="font-weight:600;cursor:pointer"><input type="checkbox" id="tk_on" style="width:1.15rem;height:1.15rem" ' + (st.tickerOn === 'true' ? 'checked' : '') + '> เปิดแสดงข้อความเลื่อน</label>' +
    '<label class="lbl mt1">ข้อความ (1 บรรทัด = 1 ข้อความ สูงสุด 10 ข้อความ ข้อความละไม่เกิน 200 ตัวอักษร)</label><textarea class="inp" id="tk_text" rows="4" placeholder="เช่น ขอเชิญร่วมเชียร์กีฬาสี วันที่ ...">' + esc(st.tickerText || '') + '</textarea>' +
    '<div class="fgrid mt1"><div><label class="lbl">ความเร็ว</label><select class="inp" id="tk_speed"><option value="slow"' + (st.tickerSpeed === 'slow' ? ' selected' : '') + '>ช้า</option><option value="normal"' + (st.tickerSpeed !== 'slow' && st.tickerSpeed !== 'fast' ? ' selected' : '') + '>ปกติ</option><option value="fast"' + (st.tickerSpeed === 'fast' ? ' selected' : '') + '>เร็ว</option></select></div>' +
    '<div><label class="lbl">สีแถบ</label><select class="inp" id="tk_tone">' + [['green', 'เขียว'], ['gold', 'ส้มทอง'], ['blue', 'น้ำเงิน'], ['red', 'แดง']].map(function (o) { return '<option value="' + o[0] + '"' + ((st.tickerTone || 'green') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div></div>' +
    '<div class="mt2"><div class="xs mut mb1">ตัวอย่าง</div><div id="tk_prev" style="border-radius:10px;overflow:hidden"></div></div>' +
    '<div class="row mt2"><button class="btn btn-primary" onclick="tickerSave()">บันทึกข้อความเลื่อน</button></div></div>';
  setTimeout(function () { ['tk_on', 'tk_text', 'tk_speed', 'tk_tone'].forEach(function (id) { var el = $('#' + id); if (el) { el.addEventListener('input', tickerPrev); el.addEventListener('change', tickerPrev); } }); tickerPrev(); }, 0);
  h += '<div class="card mt2"><h3 class="mb1">ป้ายการแข่งขัน (แบนเนอร์หน้าหลัก)</h3><div id="bannerprev" class="banner mb2" style="max-width:640px"></div><div class="row"><label class="btn btn-sm btn-primary" style="cursor:pointer">อัปโหลดป้ายการแข่งขัน<input type="file" id="bannerfile" accept="image/png,image/jpeg,image/webp" class="hide" onchange="pickBanner(this)"></label><button class="btn btn-sm" type="button" id="bannerdel" onclick="removeBanner()">ลบป้าย</button></div><div class="hint">ภาพแนวนอน (แนะนำสัดส่วนประมาณ 3:1 เช่น 1600×500 พิกเซล) ระบบย่อขนาดและบันทึกให้ทันที จะแสดงใต้ส่วนหัวของหน้าหลักสำหรับผู้เข้าชมทุกคน</div></div>';
  setTimeout(drawBannerPrev, 0);
  if (S.user.role === 'admin') h += '<div class="card mt2" style="border-color:#FECDD3"><h3 class="mb1" style="color:#BE123C">ผู้ดูแลระบบ</h3><div class="row"><button class="btn" onclick="logsModal()">ดูประวัติการใช้งานล่าสุด</button><button class="btn" onclick="applyStdPoints()">ตั้งคะแนนทุกรายการตามเกณฑ์มาตรฐาน</button><button class="btn" onclick="clearCacheBtn()">รีเฟรชแคชข้อมูล</button><button class="btn" onclick="applyRunLim()">ตั้งโควตารายการวิ่ง (วิ่ง ๑ คน/สี, มินิมาราธอน ๒ คน/สี)</button><button class="btn btn-danger" onclick="resetSeasonModal()">ล้างข้อมูลเพื่อเริ่มปีใหม่</button></div></div>';
  return h;
}
function tickerForm() { return { tickerOn: $('#tk_on').checked ? 'true' : 'false', tickerText: $('#tk_text').value, tickerSpeed: $('#tk_speed').value, tickerTone: $('#tk_tone').value }; }
function tickerPrev() {
  var el = $('#tk_prev'); if (!el) return;
  var f = tickerForm(), h = tickerHtml(Object.assign({}, f, { tickerOn: 'true' }));
  el.innerHTML = h || '<div class="empty">ยังไม่มีข้อความ</div>';
}
async function tickerSave() {
  try { await act('saveSettings', [tickerForm()], 'บันทึกข้อความเลื่อนแล้ว'); } catch (e) { if (cleanMsg(e) !== 'handled') toast(cleanMsg(e), 'err'); }
}
async function drawBannerPrev() {
  var el = $('#bannerprev'), del = $('#bannerdel'); if (!el) return;
  var ver = S.d.settings.bannerVer;
  if (del) del.style.display = ver ? '' : 'none';
  if (!ver) { el.innerHTML = '<div class="empty xs" style="padding:1.2rem">ยังไม่มีป้ายการแข่งขัน</div>'; return; }
  if (!BANNER_CACHE[ver]) {
    el.innerHTML = '<div class="empty xs" style="padding:1.2rem">กำลังโหลด…</div>';
    try { var r = await gsRun('getBanner'); if (r && r.data) BANNER_CACHE[ver] = r.data; } catch (e) { }
  }
  el = $('#bannerprev'); if (el) el.innerHTML = BANNER_CACHE[ver] ? '<img src="' + esc(BANNER_CACHE[ver]) + '" alt="ป้ายการแข่งขัน">' : '';
}
function pickBanner(inp) {
  var f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
  if (!/^image\/(png|jpeg|webp)$/.test(f.type)) { toast('รองรับเฉพาะไฟล์ PNG/JPG/WebP', 'err'); return; }
  var rd = new FileReader();
  rd.onload = function () {
    var img = new Image();
    img.onload = async function () {
      var widths = [1600, 1280, 1024, 800, 640], qs = [0.85, 0.72, 0.6, 0.48], out = '';
      for (var i = 0; i < widths.length && !out; i++) {
        var sc = Math.min(1, widths[i] / img.width), cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(img.width * sc)); cv.height = Math.max(1, Math.round(img.height * sc));
        var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
        for (var j = 0; j < qs.length; j++) { var jp = cv.toDataURL('image/jpeg', qs[j]); if (jp.length <= 175000) { out = jp; break; } }
      }
      if (!out) { toast('ภาพซับซ้อนเกินไป กรุณาใช้ภาพที่เล็กลง', 'err'); return; }
      try { await act('saveBanner', [out], 'อัปโหลดป้ายการแข่งขันแล้ว'); } catch (e) { if (cleanMsg(e) !== 'handled') toast(cleanMsg(e), 'err'); }
    };
    img.onerror = function () { toast('เปิดไฟล์ภาพไม่ได้', 'err'); };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}
function removeBanner() {
  confirmBox('ลบป้ายการแข่งขัน', 'ต้องการลบป้ายการแข่งขันออกจากหน้าหลักใช่หรือไม่', 'ลบ', true).then(async function (ok) { if (!ok) return; try { await act('saveBanner', [''], 'ลบป้ายแล้ว'); } catch (e) { if (cleanMsg(e) !== 'handled') toast(cleanMsg(e), 'err'); } });
}
function drawLogoPrev() { var el = $('#logoprev'); if (el) el.innerHTML = S.logoDraft ? '<img src="' + esc(S.logoDraft) + '" style="width:100%;height:100%;object-fit:contain;padding:14px" alt="โลโก้">' : '<span class="xs mut">ยังไม่มีโลโก้</span>'; }
function pickLogo(inp) {
  var f = inp.files && inp.files[0]; if (!f) return;
  if (!/^image\/(png|jpeg|webp)$/.test(f.type)) { toast('รองรับเฉพาะไฟล์ PNG/JPG/WebP', 'err'); return; }
  var rd = new FileReader();
  rd.onload = function () {
    var img = new Image();
    img.onload = function () {
      var sizes = [256, 192, 128], out = '';
      for (var i = 0; i < sizes.length && !out; i++) {
        var sc = Math.min(1, sizes[i] / Math.max(img.width, img.height)), cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(img.width * sc)); cv.height = Math.max(1, Math.round(img.height * sc));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        var png = cv.toDataURL('image/png'); if (png.length < 44000) { out = png; break; }
        var jp = cv.toDataURL('image/jpeg', 0.85); if (jp.length < 44000) out = jp;
      }
      if (!out) { toast('ไฟล์ภาพซับซ้อนเกินไป กรุณาใช้ภาพโลโก้ที่เล็กลง', 'err'); return; }
      S.logoDraft = out; drawLogoPrev();
    };
    img.onerror = function () { toast('เปิดไฟล์ภาพไม่ได้', 'err'); };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}
async function saveSet() {
  var v = readForm($('#setform'), SET_FIELDS);
  v.logoUrl = S.logoDraft || '';
  ['registrationOpen', 'publicScoreVisible', 'publicShowNames'].forEach(function (k) { v[k] = v[k] ? 'true' : 'false'; });
  try { await act('saveSettings', [v], 'บันทึกการตั้งค่าแล้ว'); } catch (e) { if (cleanMsg(e) !== 'handled') toast(cleanMsg(e), 'err'); }
}
async function contestToggle(id, on) {
  var cur = {}; String(S.d.settings.contestShown || '').split(',').forEach(function (x) { if (x) cur[x] = 1; });
  if (on) cur[id] = 1; else delete cur[id];
  try { await act('saveSettings', [{ contestShown: Object.keys(cur).join(',') }], on ? 'ประกาศผลรายการนี้แล้ว' : 'ซ่อนผลรายการนี้แล้ว'); } catch (e) { if (cleanMsg(e) !== 'handled') toast(cleanMsg(e), 'err'); }
}
function applyStdPoints() {
  var sc = S.d.settings.defaultPoints || '5,3,2,1', p = sc.split(',');
  confirmBox('ตั้งคะแนนทุกรายการ', 'ตั้งคะแนนของ "ทุกรายการ" เป็น ' + sc + ' (ที่ 1 = ' + p[0] + ', ที่ 2 = ' + (p[1] || 0) + ', ที่ 3 = ' + (p[2] || 0) + ', ที่ 4 = ' + (p[3] || 0) + ' คะแนน; สีที่ไม่ส่งแข่ง = 0) และคำนวณคะแนนผลที่บันทึกไว้แล้วใหม่ทั้งหมด', 'ตั้งคะแนน', false).then(async function (ok) {
    if (!ok) return;
    try { var r = await act('applyStandardPoints', [], ''); toast('ปรับคะแนนแล้ว ' + r.events + ' รายการ (คำนวณผลใหม่ ' + r.results + ' แถว)'); } catch (e) { if (cleanMsg(e) !== 'handled') toast(cleanMsg(e), 'err'); }
  });
}
async function clearCacheBtn() {
  try { await act('clearDataCache', [], 'ล้างแคชแล้ว'); } catch (e) { if (cleanMsg(e) !== 'handled') toast(cleanMsg(e), 'err'); }
}
function applyRunLim() {
  confirmBox('ตั้งโควตารายการวิ่ง', 'ตั้งจำนวนผู้เข้าแข่งต่อสีของรายการวิ่งเดี่ยวทุกรายการเป็น <b>1 คน</b> ยกเว้นมินิมาราธอนเป็น <b>2 คน</b> (รายชื่อที่ลงทะเบียนไว้เกินโควตาจะไม่ถูกลบ ต้องแก้ไขเอง)', 'ตั้งค่า').then(async function (ok) {
    if (!ok) return;
    try { var r = await act('applyRunLimits', [], ''); toast('ปรับโควตาแล้ว ' + r.events + ' รายการ' + (r.over ? ' — มี ' + r.over + ' สีที่ลงทะเบียนเกินโควตา' : '')); } catch (e) { if (cleanMsg(e) !== 'handled') toast(cleanMsg(e), 'err'); }
  });
}
async function logsModal() {
  try {
    var rows = await api('getLogs');
    modal({ title: 'ประวัติการใช้งานล่าสุด (200 รายการ)', wide: true, body: '<div class="tw"><table class="t"><thead><tr><th>เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>รายละเอียด</th></tr></thead><tbody>' + rows.map(function (r) { return '<tr><td class="xs" style="white-space:nowrap">' + esc(fmtDateTime(r.at)) + '</td><td class="xs">' + esc(r.user) + '</td><td class="xs"><b>' + esc(r.action) + '</b></td><td class="xs">' + esc(r.detail) + '</td></tr>'; }).join('') + '</tbody></table></div>', actions: [{ label: 'ปิด', close: true }] });
  } catch (e) { toast(cleanMsg(e), 'err'); }
}
function resetSeasonModal() {
  modal({
    title: 'ล้างข้อมูลเพื่อเริ่มปีใหม่', tone: 'danger',
    body: '<p style="margin-top:0">เลือกข้อมูลที่ต้องการล้าง (ไม่สามารถย้อนกลับได้ ควรสำรอง Google Sheet ก่อน)</p>' +
      '<label class="row" style="font-weight:600"><input type="checkbox" id="rs_r" checked> ผลการแข่งขัน (และรีเซ็ตสถานะทุกรายการเป็น "ยังไม่แข่ง")</label>' +
      '<label class="row" style="font-weight:600"><input type="checkbox" id="rs_a" checked> คะแนนพิเศษ/หักคะแนน</label>' +
      '<label class="row" style="font-weight:600"><input type="checkbox" id="rs_e"> รายชื่อนักกีฬาที่ลงทะเบียนทุกรายการ</label>' +
      '<label class="row" style="font-weight:600"><input type="checkbox" id="rs_s"> รายชื่อนักเรียนทั้งหมด (รวมรายชื่อลงทะเบียน)</label>' +
      '<div class="mt2"><label class="lbl">พิมพ์คำว่า <b>ล้างข้อมูล</b> เพื่อยืนยัน</label><input class="inp" id="rs_c" autocomplete="off"></div>',
    actions: [{ label: 'ยกเลิก', close: true }, {
      label: 'ล้างข้อมูล', cls: 'btn-danger', fn: async function (ctl) {
        var o = { results: $('#rs_r', ctl.el).checked, adjustments: $('#rs_a', ctl.el).checked, entries: $('#rs_e', ctl.el).checked, students: $('#rs_s', ctl.el).checked };
        var r = await act('resetSeasonData', [o, $('#rs_c', ctl.el).value], '');
        toast('ล้างแล้ว: ' + (r.cleared.join(', ') || 'ไม่มีรายการ'));
      }
    }]
  });
}

/* ===================== BOOT ===================== */
init();
</script>
